name: chaliy_nav
description: "ChaliyNav — Premium Field Navigation. Your path. Your marks. Your legacy."
publish_to: 'none'

version: 1.0.0+16

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.6.2

  # Maps
  flutter_map: ^7.0.2
  flutter_map_location_marker: ^9.1.1
  flutter_map_mbtiles: ^1.0.4
  flutter_map_marker_cluster: ^1.4.0
  latlong2: ^0.9.1

  # Background
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^18.0.1

  # Files / storage / parsing
  file_picker: ^8.1.4
  sqflite: ^2.4.1
  xml: ^6.5.0
  archive: ^4.0.2
  share_plus: ^10.1.3
  # Raster decoding: TIFF → PNG conversion during import of geo-scans
  # (.tif/.tiff+.tfw/.tfwx, plus future JNX tile extraction).
  image: ^4.3.0

  # Location & sensors
  geolocator: ^13.0.1
  sensors_plus: ^6.1.0
  flutter_compass: ^0.8.1

  # Media
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  record: ^6.0.0
  audioplayers: ^6.1.0

  # Permissions
  permission_handler: ^11.3.1

  # Storage (MVP — later swappable for Isar/Drift)
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5

  # UI / Fonts / Animations / Icons
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.16
  phosphor_flutter: ^2.1.0

  # TTS (voice guide)
  flutter_tts: ^4.2.0

  # Networking (for future cloud sync)
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.1
  collection: ^1.18.0

  # Security
  local_auth: ^2.3.0
  crypto: ^3.0.6
  encrypt: ^5.0.3
  # TODO(phase5): re-enable flutter_secure_storage once Google CDN
  # (dl.google.com) is reachable from our build environment. For now the
  # AES master key lives in SharedPreferences (obfuscated + base64).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
