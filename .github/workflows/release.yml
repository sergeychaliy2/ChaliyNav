name: Release Build (APK)

# Сборка release-APK (debug-подпись, для тестирования).
# Запускается:
#   • при пуше тега вида v1.2.3 — собирает APK и публикует GitHub Release;
#   • вручную (workflow_dispatch) — собирает APK и кладёт его в artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # нужно для создания Release и заливки APK

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaliynav-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # Только при пуше тега: публикуем Release с прикреплённым APK.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
